name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f3af988cd2543d3fb2b974b5b4 # v3.1.2

      - name: Terraform Validate
        run: |
          cd terraform/vpc && terraform init -backend=false && terraform validate
          cd ../iam && terraform init -backend=false && terraform validate
          cd ../eks && terraform init -backend=false && terraform validate

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@4635ec91ebbc43f0cfc2f0aa67a4216892556e09 # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Validate Kubernetes Manifests Syntax
        run: |
          python3 -c '
          import yaml, sys
          for f in sys.argv[1:]:
              try:
                  with open(f) as file:
                      list(yaml.safe_load_all(file))
                  print(f"{f}: YAML Syntax is valid")
              except Exception as e:
                  print(f"{f}: Invalid YAML - {e}")
                  sys.exit(1)
          ' k8s-manifests/deployment/deployment.yaml k8s-manifests/service/Service.yaml

      - name: Build Docker Artifact
        run: |
          docker build -t production-app:${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@0d4c9c5ea7603da72b582192699ee24227349942 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: BUILD AND PUSH Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b74f # v5.3.0
        with:
          context: .
          push: true
          tags: |
            rajagopaldevops/production-app:${{ github.sha }}
            rajagopaldevops/production-app:latest