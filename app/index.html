<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production AWS EKS Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 600px;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
        }
        .status-badge {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Production AWS EKS Platform</h1>
        <p>Welcome to the automated containerized deployment application powered by Kubernetes, Terraform, Docker, and CI/CD Pipelines.</p>
        <div class="status-badge">Deployment Status: Running Successfully (v1.0)</div>
        <div class="footer">Engineered by Boochi RajaGopal | DevOps & Cloud Platform</div>
    </div>
</body>
</html>
