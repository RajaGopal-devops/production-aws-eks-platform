name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a37346d564f50084f7bba553c9e7b23f5d # v3.1.2

      - name: Terraform Validate
        run: |
          cd terraform/vpc && terraform init -backend=false && terraform validate
          cd ../iam && terraform init -backend=false && terraform validate
          cd ../eks && terraform init -backend=false && terraform validate

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@2497dda2e91fd5f02d18471b561b0d23507119fua # v3.1.0 లేదా v2 equivalent SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s-manifests/deployment/deployment.yaml
          kubectl apply --dry-run=client -f k8s-manifests/service/Service.yaml

      - name: Build Docker Artifact
        run: |
          docker build -t production-app:${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fcf1117581c025da735aa291244943 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: BUILD AND PUSH Docker image
        uses: docker/build-push-action@48aba3b46d1b11ec4f01356dcf2082935e5de106 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            rajagopaldevops/production-app:${{ github.sha }}
            rajagopaldevops/production-app:latest