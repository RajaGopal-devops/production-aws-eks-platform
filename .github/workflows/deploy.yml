name: Production CI/CD Pipeline

on:
  push:
    branches: [ main,feature/* ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Validate
        run: |
          cd terraform/vpc && terraform init -backend=false && terraform validate
          cd ../iam && terraform init -backend=false && terraform validate
          cd ../eks && terraform init -backend=false && terraform validate
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@7187c3e5e3474889c25605d8f6d3f27f069bb2f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
             
      - name: Build Docker Artifact
        run: |
          docker build -t production-app:${{ github.sha }} .
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: bUILD AND PUSH dOCKER image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rajagopaldevops/prodution-app:${{ github.sha }}
            rajagopaldevops/production-app:latest
                    
          